spring:
  application:
    name: "websocket-session-lifecycle-client"
  profiles:
    active:
      # - "development"
      - "production"
  messages:
    basename: "i18n/messages"
    encoding: "UTF-8"
    default-locale: "en"
    fallback-to-system-locale: false
  threads:
    virtual:
      enabled: true

server:
  port: 8093

logging:
  config: "classpath:log/logback-spring.xml"
  logback:
    rollingpolicy:
      max-file-size: "10MB"
      max-history: "7"
      total-size-cap: "1GB"

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: "when-authorized"

app:
  websocket-client:
    server-ws-url: "http://localhost:8092/ws"
    sessions-api-url: "http://localhost:8092/api/v1/sessions"
