spring:
  application:
    name: "websocket-session-lifecycle-server"
  messages:
    basename: "i18n/messages"
    encoding: "UTF-8"
    default-locale: "en"
    fallback-to-system-locale: false
  threads:
    virtual:
      enabled: true
  profiles:
    active:
      # - "development"
      - "production"

logging:
  config: "classpath:log/logback-spring.xml"
  logback:
    rollingpolicy:
      max-file-size: "10MB"
      max-history: "7"
      total-size-cap: "1GB"

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: "when-authorized"

app:
  security:
    username: "${WEBSOCKET_ADMIN_USERNAME:session-admin}"
    password: "${WEBSOCKET_ADMIN_PASSWORD}"
  websocket:
    heartbeat-send-interval-ms: 10000
    heartbeat-receive-interval-ms: 10000
    abuse:
      max-messages: 5
      window-ms: 3000
