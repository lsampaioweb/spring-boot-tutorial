spring:
  application:
    name: "rabbitmq-fanout"
  messages:
    basename: "i18n/messages"
    encoding: "UTF-8"
    default-locale: "en"
    fallback-to-system-locale: false
  threads:
    virtual:
      enabled: true
  profiles:
    active:
      # - "development"
      - "production"
  rabbitmq:
    host: "${RABBITMQ_HOST:localhost}"
    port: "${RABBITMQ_PORT:5672}"
    username: "${RABBITMQ_DEFAULT_USER}"
    password: "${RABBITMQ_DEFAULT_PASS}"

logging:
  config: "classpath:log/logback-spring.xml"
  logback:
    rollingpolicy:
      max-file-size: "10MB"
      max-history: "7"
      total-size-cap: "1GB"

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: "when-authorized"

app:
  rabbitmq:
    exchange: "orders.fanout.exchange"
    queue-one: "orders.fanout.queue.one"
    queue-two: "orders.fanout.queue.two"
