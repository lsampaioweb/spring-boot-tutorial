---
# How to start, verify, and troubleshoot: README.md in this folder.
networks:
  tutorial-network:
    name: "tutorial-network"

services:
  redis:
    image: "redis:8.2-alpine"
    # Docs: https://hub.docker.com/_/redis
    container_name: "tutorial-redis"
    restart: "unless-stopped"
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "6379:6379"
    environment:
      - "TZ=UTC"
    networks:
      - "tutorial-network"
    # No password: samples use localhost with REDIS_HOST/REDIS_PORT only.
    # --protected-mode no is tutorial-only (bind 0.0.0.0 without AUTH).
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--save"
      - "60"
      - "1"
      - "--protected-mode"
      - "no"
    volumes:
      - "./volumes:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: "5s"
      interval: "10s"
      timeout: "3s"
      retries: 10
