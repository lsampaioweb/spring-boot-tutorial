# OpenTelemetry Collector config for the tracing tutorial sample.
# Receives OTLP and prints spans to container stdout (no trace UI).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch: {}

exporters:
  debug:
    verbosity: "detailed"

service:
  pipelines:
    traces:
      receivers: ["otlp"]
      processors: ["batch"]
      exporters: ["debug"]
