---
# How to start, init, unseal, seed, and troubleshoot: README.md in this folder.
networks:
  tutorial-network:
    name: "tutorial-network"

services:
  vault:
    image: "hashicorp/vault:1.21"
    # Docs: https://hub.docker.com/r/hashicorp/vault
    container_name: "tutorial-vault"
    restart: "unless-stopped"
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "8200:8200"
    environment:
      - "TZ=UTC"
      - "SKIP_SETCAP=true"
      - "VAULT_ADDR=http://127.0.0.1:8200"
    networks:
      - "tutorial-network"
    command: ["server", "-config=/vault/config/vault.hcl"]
    volumes:
      - "./config/vault.hcl:/vault/config/vault.hcl:ro"
      - "./volumes/file:/vault/file"
      - "./volumes/logs:/vault/logs"
    # Traefik: uncomment this block if Traefik is running on tutorial-network.
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.vault.rule=Host(`vault.lan.home`)"
    #   - "traefik.http.services.vault.loadbalancer.server.port=8200"
    #   # HTTP (default). Comment this line when Traefik HTTPS is enabled.
    #   - "traefik.http.routers.vault.entrypoints=web"
    #   # HTTPS: uncomment these two and comment the web entrypoint above.
    #   - "traefik.http.routers.vault.entrypoints=websecure"
    #   - "traefik.http.routers.vault.tls=true"
    healthcheck:
      test: ["CMD", "vault", "status"]
      start_period: "10s"
      interval: "10s"
      timeout: "5s"
      retries: 10
