spring:
  application:
    name: "cloud-config-server"
  threads:
    virtual:
      enabled: true
  profiles:
    active:
      # - "development"
      - "production"
  cloud:
    config:
      server:
        git:
          # Local repository. Default works when Maven runs from samples/19-cloud-config/server.
          uri: "file://${CONFIG_REPO_PATH:${user.dir}/../git-config}"
          cloneOnStart: true
          search-paths: "{application}/{profile}"

app:
  security:
    server:
      username: "${CONFIG_SERVER_USERNAME:config-server}"
      password: "${CONFIG_SERVER_PASSWORD}"
    cloud-config-client:
      username: "${CLOUD_CONFIG_CLIENT_USERNAME:cloud-config-client}"
      password: "${CLOUD_CONFIG_CLIENT_PASSWORD}"

logging:
  config: "classpath:log/logback-spring.xml"
  logback:
    rollingpolicy:
      max-file-size: "10MB"
      max-history: "7"
      total-size-cap: "1GB"

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: "when-authorized"
