# Part 1. Config here.
# user:
#   role: "Default"

# Part 2. Config in remote server.
spring:
  application:
    name: "cloud-config-client"
  threads:
    virtual:
      enabled: true
  messages:
    basename: "i18n/messages"
    encoding: "UTF-8"
    default-locale: "en"
    fallback-to-system-locale: false
  profiles:
    active:
      # - "development"
      - "production"
  cloud:
    config:
      username: "${USERNAME}"
      password: "${PASSWORD}"
  config:
            # import: "optional:configserver:https://config-server.example:9443"
            import: "optional:configserver:https://localhost:9443"

logging:
  config: "classpath:log/logback-spring.xml"
  logback:
    rollingpolicy:
      max-file-size: "10MB"
      max-history: "7"
      total-size-cap: "1GB"

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: "when-authorized"

app:
  hello:
    role: "${user.role}"
    server-port: "${server.port}"
