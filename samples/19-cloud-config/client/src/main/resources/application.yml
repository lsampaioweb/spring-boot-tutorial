spring:
  application:
    name: "cloud-config-client"
  threads:
    virtual:
      enabled: true
  messages:
    basename: "i18n/messages"
    encoding: "UTF-8"
    default-locale: "en"
    fallback-to-system-locale: false
  profiles:
    active:
      # - "development"
      - "production"
  cloud:
    config:
      username: "${CLOUD_CONFIG_CLIENT_USERNAME:cloud-config-client}"
      password: "${CLOUD_CONFIG_CLIENT_PASSWORD}"

logging:
  config: "classpath:log/logback-spring.xml"
  logback:
    rollingpolicy:
      max-file-size: "10MB"
      max-history: "7"
      total-size-cap: "1GB"

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: "when-authorized"

app:
  hello:
    role: "${user.role:local}"
    server-port: "${server.port}"
  security:
    username: "${CLOUD_CONFIG_API_USERNAME:cloud-config-api}"
    password: "${CLOUD_CONFIG_API_PASSWORD}"
