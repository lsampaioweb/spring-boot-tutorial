spring:
  application:
    name: "postgres"
  messages:
    basename: "i18n/messages"
    encoding: "UTF-8"
    default-locale: "en"
    fallback-to-system-locale: false
  threads:
    virtual:
      enabled: true
  profiles:
    active:
      # - "development"
      - "production"
  datasource:
    driver-class-name: "org.postgresql.Driver"
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}"
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
    hikari:
      # Maximum number of connections in the pool (default: 10).
      maximum-pool-size: 10
      # Minimum number of idle connections in the pool (default: same as max).
      minimum-idle: 2
      # Time (ms) before an idle connection is removed (must be less than max-lifetime).
      idle-timeout: 30000
      # Maximum time (ms) to wait for a connection before throwing an error.
      connection-timeout: 20000

logging:
  config: "classpath:log/logback-spring.xml"
  logback:
    rollingpolicy:
      max-file-size: "10MB"
      max-history: "7"
      total-size-cap: "1GB"

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: "when-authorized"
