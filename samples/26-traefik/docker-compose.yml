networks:
  # Uses the infrastructure network created by samples/infrastructure/traefik.
  tutorial-network:
    name: "tutorial-network"
    external: true

services:
  app:
    # Specifies the image built for this application.
    image: "lsampaioweb/app:1.0"

    # Sets a consistent container name for easier identification.
    container_name: "app"

    # Ensures the container restarts unless explicitly stopped by the user.
    restart: "unless-stopped"

    # Configures the Spring profile dynamically with a safe production default.
    environment:
      - "SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-production}"
      # Set SPRING_PROFILES_ACTIVE=development and SERVER_PORT=8080 explicitly to enable development-only behavior.
      - "SECURITY_ACTUATOR_USERNAME=${SECURITY_ACTUATOR_USERNAME:?set SECURITY_ACTUATOR_USERNAME}"
      - "SECURITY_ACTUATOR_PASSWORD=${SECURITY_ACTUATOR_PASSWORD:?set SECURITY_ACTUATOR_PASSWORD}"

    # Configures Traefik labels. Host must match TRAEFIK_DOMAIN (default lan.home).
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`app.lan.home`)"
      - "traefik.http.services.app.loadbalancer.server.port=${SERVER_PORT:-9443}"
      # HTTP (default). Comment this line when Traefik HTTPS is enabled.
      - "traefik.http.routers.app.entrypoints=web"
      # HTTPS: uncomment these two and comment the web entrypoint above.
      # - "traefik.http.routers.app.entrypoints=websecure"
      # - "traefik.http.routers.app.tls=true"

    # Connects the app to the external Traefik network for routing.
    networks:
      - "tutorial-network"

    # Maps host directories to the container.
    volumes:
      # Persists application logs to the host filesystem.
      - "./logs:/opt/app/logs"
      # Optional: Mount SSL certificates if app handles TLS directly.
      # - "./ssl/:/opt/app/ssl/:ro"

    # Declares explicit runtime bounds for local container safety.
    cpus: "1.00"
    mem_limit: "768m"
    mem_reservation: "256m"

    # Defines a health check to ensure the app is running and responsive.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://localhost:${SERVER_PORT:-9443}/actuator/health || exit 1",
        ]
      start_period: "4s"
      interval: "10s"
      timeout: "2s"
      retries: 2
