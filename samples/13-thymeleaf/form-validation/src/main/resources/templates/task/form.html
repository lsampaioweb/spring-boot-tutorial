<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en_US">

<head>
  <meta charset="UTF-8" />
  <title th:text="#{page.task.title}">Task Form — Thymeleaf Validation</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
  <h1 th:text="#{page.task.heading}">Add Task</h1>

  <form method="POST" th:action="@{/tasks}" th:object="${task}">
    <div class="form-group" th:classappend="${#fields.hasErrors('title')} ? 'has-error'">
      <label for="title" th:text="#{page.task.label.title}">Title</label>
      <input id="title" type="text" th:field="*{title}" th:placeholder="#{page.task.placeholder.title}" placeholder="Task title" />
      <span class="error-message" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
    </div>

    <div class="form-group" th:classappend="${#fields.hasErrors('description')} ? 'has-error'">
      <label for="description" th:text="#{page.task.label.description}">Description</label>
      <textarea id="description" th:field="*{description}" th:placeholder="#{page.task.placeholder.description}" placeholder="Optional, max 200 characters"></textarea>
      <span class="error-message" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
    </div>

    <div class="form-group" th:classappend="${#fields.hasErrors('assignedTo')} ? 'has-error'">
      <label for="assignedTo" th:text="#{page.task.label.assignedTo}">Assigned To (email)</label>
      <input id="assignedTo" type="text" th:field="*{assignedTo}" th:placeholder="#{page.task.placeholder.assignedTo}" placeholder="user@example.com" />
      <span class="error-message" th:if="${#fields.hasErrors('assignedTo')}" th:errors="*{assignedTo}"></span>
    </div>

    <button type="submit" th:text="#{page.task.submit}">Add Task</button>
  </form>

  <hr />

  <h2 th:text="#{page.task.list.heading}">Tasks</h2>

  <p th:if="${#lists.isEmpty(tasks)}" th:text="#{page.task.list.empty}">No tasks yet.</p>

  <table th:unless="${#lists.isEmpty(tasks)}">
    <thead>
      <tr>
        <th th:text="#{page.task.column.id}">#</th>
        <th th:text="#{page.task.column.title}">Title</th>
        <th th:text="#{page.task.column.description}">Description</th>
        <th th:text="#{page.task.column.assignedTo}">Assigned To</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="t : ${tasks}">
        <td th:text="${t.id}"></td>
        <td th:text="${t.title}"></td>
        <td th:text="${t.description}"></td>
        <td th:text="${t.assignedTo}"></td>
      </tr>
    </tbody>
  </table>
</body>

</html>
