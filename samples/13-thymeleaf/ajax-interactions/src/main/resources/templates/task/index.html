<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en_US">

<head>
  <meta charset="UTF-8" />
  <title th:text="#{page.task.title}">Tasks — Thymeleaf AJAX</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
  <h1 th:text="#{page.task.heading}">Tasks</h1>

  <div class="add-form">
    <label for="title-input" th:text="#{page.task.label.title}">New task title</label>
    <input id="title-input" type="text" th:placeholder="#{page.task.placeholder.title}" placeholder="New task title" />
    <button id="add-btn" th:text="#{page.task.submit}">Add</button>
  </div>

  <!--
    th:fragment="task-list" marks this element so the controller can return
    just this section as a fragment response if needed in the future.
    Currently we return individual rows (task-row) for adds.
  -->
  <table id="task-table">
    <thead>
      <tr>
        <th th:text="#{page.task.column.id}">#</th>
        <th th:text="#{page.task.column.title}">Title</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="task-body" th:fragment="task-list">
      <tr th:if="${#lists.isEmpty(tasks)}">
        <td colspan="3" th:text="#{page.task.list.empty}">No tasks yet.</td>
      </tr>
      <tr th:each="t : ${tasks}" th:fragment="task-row" th:id="'row-' + ${t.id()}">
        <td th:text="${t.id()}"></td>
        <td th:text="${t.title()}"></td>
        <td><button class="delete-btn" th:data-id="${t.id()}" th:text="#{page.task.remove}">Remove</button></td>
      </tr>
    </tbody>
  </table>

  <!--
    When the controller returns "task/index :: task-row" for a single task,
    Thymeleaf renders only the <tr th:fragment="task-row"> element.
    JS appends that HTML to #task-body without a full page reload.
  -->
  <script th:src="@{/js/tasks.js}"></script>
</body>

</html>
